<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0b">
<title>115 // Easter Egg Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0b;
    --bg2:#14150f;
    --panel:#191a13;
    --panel2:#20221a;
    --line:#2e3124;
    --bone:#e6e2d3;
    --bone-dim:#a39f8e;
    --mute:#6f6c5d;
    --c115:#3fe0c6;       /* element 115 glow */
    --c115-dim:#1f8f80;
    --blood:#c0392b;
    --blood-deep:#7a1f17;
    --amber:#e6a23a;
    --aether:#9b6bd8;
    --radius:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--bone);
    font-family:"Inter",system-ui,sans-serif;
    line-height:1.5;
    overflow-x:hidden;
    background-image:
      radial-gradient(120% 60% at 50% -10%, rgba(63,224,198,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }
  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg, rgba(12,13,11,.97), rgba(12,13,11,.86));
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 14px) 16px 0;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .core{
    width:30px;height:30px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 50% 40%, #bafff3 0%, var(--c115) 38%, var(--c115-dim) 70%, #073b35 100%);
    box-shadow:0 0 14px rgba(63,224,198,.65), inset 0 0 6px rgba(0,0,0,.4);
    animation:pulse 2.6s ease-in-out infinite;
  }
  .core::after{content:"115";position:absolute;inset:0;display:grid;place-items:center;
    font:700 9px/1 "Space Mono",monospace;color:#04221d;letter-spacing:.5px}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(63,224,198,.5),inset 0 0 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 20px rgba(63,224,198,.9),inset 0 0 6px rgba(0,0,0,.4)}}
  h1{font-family:"Black Ops One",cursive;font-size:19px;letter-spacing:.5px;margin:0;line-height:1.1;color:var(--bone)}
  h1 small{display:block;font-family:"Space Mono",monospace;font-weight:400;font-size:9.5px;letter-spacing:2.5px;color:var(--c115);margin-top:3px}
  /* ---------- game tabs ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:13px 0 11px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--bone-dim);font-family:"Oswald",sans-serif;font-weight:600;
    font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:8px 13px;border-radius:var(--radius);cursor:pointer;white-space:nowrap;
    transition:.18s;position:relative;
  }
  .tab .yr{font-family:"Space Mono",monospace;font-size:9px;display:block;color:var(--mute);letter-spacing:0;margin-top:1px;text-align:left}
  .tab.active{color:#04221d;background:var(--c115);border-color:var(--c115);box-shadow:0 0 14px rgba(63,224,198,.4)}
  .tab.active .yr{color:#063c34}
  /* ---------- layout ---------- */
  main{padding:18px 16px 60px;max-width:680px;margin:0 auto}
  .gtitle{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:1px;font-weight:700;
    font-size:14px;color:var(--bone);display:flex;align-items:baseline;gap:8px;margin:6px 0 4px}
  .gtitle .ix{font-family:"Space Mono",monospace;font-size:11px;color:var(--c115)}
  .gsub{font-size:12px;color:var(--mute);margin:0 0 16px;font-family:"Space Mono",monospace;letter-spacing:.3px}
  /* ---------- map cards ---------- */
  .card{
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-left:3px solid var(--c115-dim);
    border-radius:var(--radius);padding:13px 14px;margin-bottom:11px;cursor:pointer;
    transition:.16s;position:relative;
  }
  .card:active{transform:scale(.992)}
  .card.noee{border-left-color:#3a3d2d;opacity:.92}
  .card .mname{font-family:"Oswald",sans-serif;font-weight:600;font-size:16.5px;letter-spacing:.3px;color:var(--bone);line-height:1.15}
  .card .qname{font-size:12.5px;color:var(--c115);margin-top:3px;font-weight:500}
  .card.noee .qname{color:var(--mute)}
  .card .row{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
  .pips{display:flex;gap:3px;align-items:center}
  .pip{width:7px;height:7px;border-radius:1px;background:#33362708;border:1px solid var(--line)}
  .pip.on{background:var(--blood);border-color:var(--blood);box-shadow:0 0 5px rgba(192,57,43,.5)}
  .meta{font-family:"Space Mono",monospace;font-size:10px;color:var(--mute);letter-spacing:.4px;text-transform:uppercase}
  .go{margin-left:auto;color:var(--c115);font-size:18px;line-height:1;opacity:.8}
  .card.noee .go{color:var(--mute)}
  /* ---------- detail overlay ---------- */
  .sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
    transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    -webkit-overflow-scrolling:touch}
  .sheet.open{transform:translateX(0)}
  .sheet-top{position:sticky;top:0;z-index:5;background:rgba(12,13,11,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;
    display:flex;align-items:center;gap:12px}
  .back{border:1px solid var(--line);background:var(--panel);color:var(--bone);border-radius:var(--radius);
    width:38px;height:38px;flex:0 0 auto;font-size:18px;cursor:pointer;display:grid;place-items:center;line-height:1}
  .back:active{background:var(--panel2)}
  .sheet-top .st{font-family:"Oswald",sans-serif;font-weight:600;font-size:16px;letter-spacing:.4px;text-transform:uppercase;line-height:1.1}
  .sheet-top .sq{font-size:11px;color:var(--c115);font-family:"Space Mono",monospace}
  .sheet-body{padding:18px 16px calc(env(safe-area-inset-bottom) + 60px);max-width:680px;margin:0 auto}

  .stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1 1 0;min-width:84px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px}
  .stat .k{font-family:"Space Mono",monospace;font-size:8.5px;letter-spacing:1.5px;color:var(--mute);text-transform:uppercase}
  .stat .v{font-family:"Oswald",sans-serif;font-weight:600;font-size:14px;color:var(--bone);margin-top:3px;letter-spacing:.3px}
  .stat .v.acc{color:var(--c115)}

  .blurb{font-size:14.5px;color:var(--bone-dim);margin:0 0 20px;border-left:2px solid var(--blood-deep);padding-left:13px}

  .sec{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;font-size:12px;
    color:var(--c115);margin:24px 0 12px;display:flex;align-items:center;gap:9px}
  .sec::before{content:"";width:14px;height:1px;background:var(--c115);box-shadow:0 0 6px var(--c115)}
  .sec.r{color:var(--amber)}
  .sec.r::before{background:var(--amber);box-shadow:0 0 6px var(--amber)}

  ul.req{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  ul.req li{display:flex;gap:10px;font-size:13.5px;color:var(--bone-dim);align-items:flex-start}
  ul.req li::before{content:"▣";color:var(--c115-dim);font-size:12px;line-height:1.4;flex:0 0 auto}

  ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:14px;color:var(--bone-dim)}
  ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-1px;
    font-family:"Space Mono",monospace;font-weight:700;font-size:12px;color:var(--c115);
    border:1px solid var(--c115-dim);border-radius:var(--radius);width:27px;height:24px;display:grid;place-items:center;
    background:rgba(63,224,198,.06)}
  ol.steps li::after{content:"";position:absolute;left:13px;top:25px;bottom:2px;width:1px;background:var(--line)}
  ol.steps li:last-child::after{display:none}
  ol.steps li b{color:var(--bone);font-weight:600}

  .note{background:rgba(230,162,58,.07);border:1px solid rgba(230,162,58,.3);border-radius:var(--radius);
    padding:12px 13px;font-size:12.5px;color:var(--amber);margin:18px 0;display:flex;gap:10px;align-items:flex-start}
  .note b{color:#f3c073}
  .note .ic{flex:0 0 auto;font-size:14px;line-height:1.3}

  .tips{display:grid;gap:8px}
  .tip{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--bone-dim)}
  .tip b{color:var(--c115);font-weight:600}

  .btnrow{display:grid;gap:10px;margin-top:24px}
  .vidbtn{display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
    font-size:13px;text-decoration:none}
  .vidbtn .pl{color:#ff3b30;font-size:13px;text-shadow:0 0 8px rgba(255,59,48,.5)}
  .vidbtn:active{background:var(--panel2)}
  .wikibtn{display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--blood);color:#fff;border:1px solid var(--blood);border-radius:var(--radius);
    padding:14px;font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
    font-size:13px;text-decoration:none;box-shadow:0 0 18px rgba(192,57,43,.3)}
  .wikibtn:active{background:var(--blood-deep)}
  .wikibtn span{font-family:"Space Mono",monospace;font-size:14px}

  /* intro disclaimer */
  .intro{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-left:3px solid var(--amber);border-radius:var(--radius);padding:13px 14px;margin-bottom:18px;font-size:12.5px;color:var(--bone-dim)}
  .intro b{color:var(--amber)}
  footer{text-align:center;padding:26px 16px calc(env(safe-area-inset-bottom) + 30px);color:var(--mute);
    font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.6px;line-height:1.7}
  @media (prefers-reduced-motion:reduce){
    .core{animation:none}.sheet{transition:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="core" aria-hidden="true"></div>
    <h1>Easter Egg Field Manual<small>WORLD AT WAR → BLACK OPS 4 // MAIN QUESTS</small></h1>
  </div>
  <nav class="tabs" id="tabs" aria-label="Select game"></nav>
</header>

<main id="main"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-top">
    <button class="back" id="back" aria-label="Back to map list">‹</button>
    <div>
      <div class="st" id="sheetName"></div>
      <div class="sq" id="sheetQuest"></div>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<footer id="foot"></footer>

<script>
const WIKI="https://callofduty.fandom.com/wiki/";

/* Data: games -> maps. Steps are MAJOR BEATS (community-verified shape).
   "rand" flags quests with per-game randomized sub-steps that need a live guide. */
const DATA=[
{id:"waw",name:"World at War",ix:"01",year:"2008",sub:"The origin. Treyarch's first zombies — only Der Riese has a true quest.",
 maps:[
  {n:"Nacht der Untoten",q:"No main quest — survival only",noee:true,diff:0,players:"1–4",
   blurb:"The map that started it all. No quest, no Pack-a-Punch, no perks. Pure survival in a bombed-out bunker.",
   easter:"Hidden song: shoot the radio to the right of the Mystery Box in the Help Room to trigger the track \"WTF\". (In later remasters, shoot the 9 red barrels outside for \"Undone\".)"},
  {n:"Verrückt",q:"No main quest — survival only",noee:true,diff:0,players:"1–4",
   blurb:"The asylum. Introduced Perk-a-Colas and the power switch. No completable quest.",

  {n:"Shi No Numa",q:"No main quest — survival only",noee:true,diff:0,players:"1–4",

   easter:"Hidden song: shoot the four hanging pans inside the Fishing Hut."},
  {n:"Der Riese",q:"Fly Trap",url:"Fly_Trap",diff:1,players:"1–4",reward:"Permanently unlocks Pack-a-Punch",accuracy:"High",
   blurb:"The Giant. The first-ever Zombies Easter egg. There's no cutscene reward — completing it simply unlocks the Pack-a-Punch teleporter sequence and plays a buzzing fly / teddy bear sound.",

    "Go to <b>Teleporter A, B or C</b>, stand on the pad and <b>activate it</b> to start the link timer.",

    "<b>Repeat for all three teleporters.</b> Once all three are linked, the mainframe becomes the Pack-a-Punch.",
    "Stand on any linked teleporter and activate to be sent to <b>Pack-a-Punch</b> (available for ~30s per teleport).",
    "Pack-a-Punch a weapon to confirm. The fly swarm / bear sound marks the loop complete."],

 ]},

{id:"bo1",name:"Black Ops",ix:"02",year:"2010",sub:"Easter eggs become real questlines with reward cutscenes, starting with Ascension.",
 maps:[
  {n:"Kino der Toten",q:"No main quest",noee:true,diff:0,players:"1–4",
   blurb:"The theater. The first map to feature teleporters tied to Pack-a-Punch as a core mechanic, plus the three teddy bears. No completable main quest.",
   easter:"Hidden song \"115\" by Elena Siegman: activate the three meteor rocks (one near spawn, one in the dressing room, one in the alley)."},
  {n:'"Five"',q:"No main quest",noee:true,diff:0,players:"1–4",

  {n:"Ascension",q:"Casimir Mechanism",url:"Casimir_Mechanism",diff:2,players:"Co-op (4 recommended)",reward:"Free perk drop + lore audio reels",accuracy:"Shape only",rand:true,
   blurb:"The Soviet cosmodrome. The first true rewarded main quest — free the trapped scientist Gersh by powering the Casimir Mechanism.",
   req:["Power on","Gersh Devices (from the Mystery Box) — central to the quest","Lunar Landers to reach all areas","Best done with 3–4 players for the simultaneous steps"],
   steps:[
    "Turn on the power and get the map running.",
    "Locate and <b>activate the hidden eclipse / focusing-stone objects</b> around the map to begin the sequence.",

  {n:"Call of the Dead",q:"Ensemble Cast (co-op) / Stand-in (solo)",url:"Ensemble_Cast",diff:2,players:"1 (Stand-in) or 4 (Ensemble Cast)",reward:"Vril Rod weapon + frees George Romero",accuracy:"Shape only",rand:true,

   req:["Power on","Scavenger sniper / Wunderwaffe DG-2 (from the box)","Cooperation to lead Romero into the water"],
   steps:[
    "Turn on the power and build access to the lighthouse and ship.",
    "<b>Free the V-R11</b> / gather the wonder weapons needed for the steps.",
    "Complete the <b>lighthouse and Vril-rod assembly</b> objectives in sequence.",
    "<b>Lure George Romero</b> into the electrified water / shock him per the final step to weaken and release him.",

  {n:"Shangri-La",q:"Time Travel Will Tell",url:"Time_Travel_Will_Tell",diff:3,players:"Co-op (2+)",reward:"Focusing Stone + permanent Pack-a-Punch perk",accuracy:"Shape only",rand:true,
   blurb:"A tropical temple with the Primis-era crew. A puzzle-heavy quest involving the map's geyser/mine-cart traversal, the focusing stone, and time manipulation.",
   req:["Power / map traversal unlocked","The map's wonder weapons (31-79 JGb215 + Shrink Ray steps)","2+ players for simultaneous switches"],
   steps:[

    "Complete the <b>eclipse / waterfall and pressure-plate</b> puzzles.",

  {n:"Moon",q:"Richtofen's Grand Scheme",url:"Richtofen%27s_Grand_Scheme",diff:3,players:"Co-op (recommended)",reward:"Richtofen takes control of the zombies (story-defining)",accuracy:"Shape only",rand:true,

    "Complete the <b>Cryogenic Slumber Party</b> setup (gather and place the canisters at the pyramid/M.P.D).",
    "Excavate by detonating the tunnels and route Richtofen's plan with the <b>Gersh Devices and switches</b>.",
    "Charge the <b>pyramid (M.P.D)</b> through the required steps.",
    "Choose your side: complete <b>Richtofen's Grand Scheme</b> (swap him into the Aether) — or Maxis' alternate path.",
    "Trigger the finale — three rockets strike Earth and Richtofen assumes control of the undead."],
   tips:["Keep the P.E.S helmet up in vacuum zones or you'll suffocate.","This quest ends the original timeline — it leads directly into Black Ops II's story."]}
 ]},

{id:"bo2",name:"Black Ops II",ix:"03",year:"2012",sub:"The branching Maxis vs. Richtofen saga, plus Mob of the Dead and Origins.",
 maps:[
  {n:"TranZit",q:"Tower of Babble",url:"Tower_of_Babble",diff:3,players:"Co-op (4 recommended)",reward:"Aligns the storyline with Maxis or Richtofen",accuracy:"Shape only",rand:true,
   blurb:"The bus route through the fog. Build the obelisk Tower and power it for either Maxis or Richtofen by feeding zombie souls into it.",

    "Travel the bus route and <b>place EMP grenades / Turbines</b> at the lamp posts as directed.",
    "<b>Charge the Tower</b> by killing zombies near it after the lamps are linked.",
    "Choose a side — follow <b>Maxis'</b> instructions (galvaknuckle the EMP'd zombie) or <b>Richtofen's</b> (kill in the Tower's beam).",

  {n:"Die Rise",q:"High Maintenance",url:"High_Maintenance",diff:3,players:"Co-op (4 recommended)",reward:"Continues the Maxis/Richtofen branch",accuracy:"Shape only",rand:true,
   blurb:"The collapsing skyscrapers of China. Build the Trample Steam, feed the Tower (again Maxis vs. Richtofen), and use elevators and the Sliquifier.",
   req:["Sliquifier (buildable wonder weapon)","Trample Steam","Ballistic knife + Sliquifier for steps","Mahjong tile and shrine knowledge"],
   steps:[

    "Find and align the <b>four mahjong-style symbols / shrine objects</b> as instructed.",

    "Charge the objective for <b>Maxis or Richtofen</b> by killing zombies in the right state/location.",

   tips:["The Sliquifier's chain damage is your best high-round tool.","Use the elevators as quick traps — they crush zombies."]},
  {n:"Mob of the Dead",q:"Pop Goes the Weasel  ·  No One Escapes Alive (fly the Icarus)",url:"Pop_Goes_the_Weasel",diff:4,players:"1–4",reward:"Free perks + the Golden Spork; flying the Icarus completes the loop",accuracy:"Shape (plane parts vary)",rand:true,

   steps:[

/* ---------- render ---------- */
const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');
const sheet=document.getElementById('sheet');
let active=0;

DATA.forEach((g,i)=>{
  const b=document.createElement('button');
  b.className='tab'+(i===0?' active':'');
  b.innerHTML=g.name+'<span class="yr">'+g.year+'</span>';
  b.onclick=()=>{active=i;[...tabsEl.children].forEach(c=>c.classList.remove('active'));b.classList.add('active');renderGame();window.scrollTo({top:0,behavior:'smooth'});};
  tabsEl.appendChild(b);
});

function diffPips(d){
  let h='<div class="pips" aria-label="difficulty '+d+' of 5">';
  for(let i=1;i<=5;i++) h+='<div class="pip'+(i<=d?' on':'')+'"></div>';
  return h+'</div>';
}

function renderGame(){
  const g=DATA[active];
  let h='<div class="gtitle"><span class="ix">'+g.ix+'</span>'+g.name+'</div><p class="gsub">'+g.sub+'</p>';
  if(active===0){
    h+='<div class="intro"><b>How to use this manual.</b> Each entry gives the quest name, setup, major beats and reward. Open any map for two buttons at the bottom: <b>Watch video guides</b> (the best way to see the actual map visuals in motion) and the <b>full written guide</b> on the CoD Wiki. Steps that are <b>randomized every match</b> (symbol orders, part spawns) are flagged — follow a live video for those exact inputs.</div>';
  }
  g.maps.forEach((m,j)=>{
    h+='<div class="card'+(m.noee?' noee':'')+'" data-g="'+active+'" data-m="'+j+'">'+
       '<div class="mname">'+m.n+'</div>'+
       '<div class="qname">'+m.q+'</div>'+
       '<div class="row">'+
         (m.noee?'<span class="meta">No quest · '+(m.players||'1–4')+'</span>':diffPips(m.diff)+'<span class="meta">'+m.players+'</span>')+
         '<span class="go">'+(m.noee?'›':'›')+'</span>'+
       '</div></div>';
  });
  mainEl.innerHTML=h;
  mainEl.querySelectorAll('.card').forEach(c=>c.onclick=()=>openSheet(+c.dataset.g,+c.dataset.m));
}

function openSheet(gi,mi){
  const m=DATA[gi].maps[mi];
  document.getElementById('sheetName').textContent=m.n;
  document.getElementById('sheetQuest').textContent=m.noee?'No main quest':m.q;
  let h='';
  // stat strip
  h+='<div class="stat-strip">';
  h+='<div class="stat"><div class="k">Difficulty</div><div class="v">'+(m.noee?'—':m.diff+' / 5')+'</div></div>';
  h+='<div class="stat"><div class="k">Players</div><div class="v">'+(m.players||'1–4')+'</div></div>';
  if(m.accuracy) h+='<div class="stat"><div class="k">Detail</div><div class="v acc">'+m.accuracy+'</div></div>';
  else if(m.noee) h+='<div class="stat"><div class="k">Type</div><div class="v acc">Survival</div></div>';
  h+='</div>';

  h+='<p class="blurb">'+m.blurb+'</p>';

  if(m.reward){h+='<div class="sec r">Reward</div><div class="tip" style="border-color:rgba(230,162,58,.3)">'+m.reward+'</div>';}

  if(m.noee && m.easter){
    h+='<div class="sec">Hidden / Side Easter Egg</div><div class="tip">'+m.easter+'</div>';
  }

  if(m.req){
    h+='<div class="sec">Required Setup</div><ul class="req">';
    m.req.forEach(r=>h+='<li>'+r+'</li>');
    h+='</ul>';
  }

  if(m.steps){
    h+='<div class="sec">Walkthrough — Major Steps</div>';
    if(m.rand){
      h+='<div class="note"><span class="ic">⚠</span><div><b>Randomized steps.</b> Parts of this quest (symbol sequences, item locations) change every game. Use these beats for the overall flow, but follow the linked guide live for the exact inputs in your match.</div></div>';
    }
    h+='<ol class="steps">';
    m.steps.forEach(s=>h+='<li>'+s+'</li>');
    h+='</ol>';
  }

  if(m.note){
    h+='<div class="note"><span class="ic">ℹ</span><div>'+m.note+'</div></div>';
  }

  if(m.tips){
    h+='<div class="sec">Field Tips</div><div class="tips">';
    m.tips.forEach(t=>h+='<div class="tip">'+t+'</div>');
    h+='</div>';
  }

  const url=WIKI+(m.url||m.n.replace(/[^A-Za-z0-9]/g,'_'));
  const q=encodeURIComponent(m.n+' '+DATA[gi].name+' zombies easter egg '+(m.noee?'song':'guide'));
  const yt='https://www.youtube.com/results?search_query='+q;
  h+='<div class="btnrow">';
  h+='<a class="vidbtn" href="'+yt+'" target="_blank" rel="noopener"><span class="pl">▶</span> Watch video guides</a>';
  h+='<a class="wikibtn" href="'+url+'" target="_blank" rel="noopener">Full written guide — CoD Wiki <span>↗</span></a>';
  h+='</div>';

  document.getElementById('sheetBody').innerHTML=h;
  sheet.classList.add('open');
  sheet.scrollTop=0;
  document.body.style.overflow='hidden';
}

document.getElementById('back').onclick=()=>{sheet.classList.remove('open');document.body.style.overflow=''};

// footer
document.getElementById('foot').innerHTML=
  'FIELD MANUAL // 5 GAMES · '+DATA.reduce((a,g)=>a+g.maps.length,0)+' MAPS<br>'+
  'Major-beat reference. Verify randomized steps with a live guide.<br>'+
  'Source: Call of Duty Wiki (Fandom) · Not affiliated with Activision/Treyarch.';

renderGame();
</script>
