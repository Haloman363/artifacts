<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link rel="icon" href="icons/icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
  }

  .scanlines {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none; z-index: 0;
  }

  .grid-bg {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background-image:
      linear-gradient(rgba(0,255,200,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,200,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  .app { position: relative; z-index: 1; width: 100%; max-width: 520px; }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-align: center;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.3);
    text-align: center;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .mode-tabs {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .mode-tab {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.4);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 6px 14px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .mode-tab.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.08);
  }

  .timer-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
  }

  .ring-svg { overflow: visible; display: block; }
  .ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
  .ring-prog {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: butt;
    transition: stroke-dashoffset 0.5s linear, stroke 0.4s;
    filter: drop-shadow(0 0 6px var(--accent));
  }

  .timer-inner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 220px;
  }

  .timer-display {
    font-family: 'Orbitron', monospace;
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 20px var(--accent), 0 0 40px rgba(var(--accent-rgb), 0.4);
  }

  .round-info {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.35);
    margin-top: 10px;
    text-transform: uppercase;
  }

  .round-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    border: 1px solid rgba(var(--accent-rgb), 0.5);
    background: transparent;
    transition: background 0.3s;
  }

  .dot.done { background: var(--accent); }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .btn {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 12px 28px;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    border: 1px solid;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.5);
  }

  .btn-primary:hover { box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.75); transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
  }

  .btn-secondary:hover { border-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.85); }

  .settings-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    text-transform: uppercase;
    margin-bottom: 16px;
    transition: color 0.2s;
  }

  .settings-toggle:hover { color: var(--accent); }

  .settings-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 20px;
    display: none;
  }

  .settings-panel.open { display: block; }

  .settings-section { margin-bottom: 20px; }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.7;
  }

  .setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .setting-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    width: 120px;
    flex-shrink: 0;
    letter-spacing: 0.06em;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: rgba(255,255,255,0.12);
    outline: none;
    border-radius: 0;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 0;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.8);
  }

  .setting-val {
    font-size: 12px;
    color: #fff;
    min-width: 36px;
    text-align: right;
    font-family: 'Orbitron', monospace;
  }

  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }

  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 2px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }

  .color-swatch.active, .color-swatch:hover { transform: scale(1.15); border-color: #fff; }

  .sound-grid { display: flex; gap: 6px; flex-wrap: wrap; }

  .sound-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .sound-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.1);
  }

  .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }

  .toggle {
    width: 36px; height: 18px;
    background: rgba(255,255,255,0.1);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  .toggle.on { background: rgba(var(--accent-rgb), 0.4); border-color: var(--accent); }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transition: transform 0.2s, background 0.2s;
  }

  .toggle.on::after { transform: translateX(18px); background: var(--accent); }

  .toggle-label { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.06em; }

  .status-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .stat { text-align: center; }

  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>

<div class="app" id="app">
  <h1>POMODORO.EXE</h1>
  <div class="subtitle">Focus protocol active</div>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="work">Work</button>
    <button class="mode-tab" data-mode="shortBreak">Short Break</button>
    <button class="mode-tab" data-mode="longBreak">Long Break</button>
  </div>

  <div class="timer-wrap">
    <svg class="ring-svg" width="340" height="340" viewBox="0 0 340 340">
      <circle class="ring-track" cx="170" cy="170" r="148"/>
      <circle class="ring-prog" id="ringProg" cx="170" cy="170" r="148"
        stroke-dasharray="929.91"
        stroke-dashoffset="0"
        transform="rotate(-90 170 170)"/>
      <line x1="170" y1="14" x2="170" y2="30" stroke="rgba(0,255,200,0.3)" stroke-width="1"/>
      <line x1="326" y1="170" x2="310" y2="170" stroke="rgba(0,255,200,0.3)" stroke-width="1"/>
      <line x1="14" y1="170" x2="30" y2="170" stroke="rgba(0,255,200,0.3)" stroke-width="1"/>
      <line x1="170" y1="326" x2="170" y2="310" stroke="rgba(0,255,200,0.3)" stroke-width="1"/>
    </svg>
    <div class="timer-inner">
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="round-info" id="roundInfo">ROUND 1 / 4</div>
      <div class="round-dots" id="roundDots"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="resetBtn">RESET</button>
    <button class="btn btn-primary" id="startBtn">START</button>
    <button class="btn btn-secondary" id="skipBtn">SKIP</button>
  </div>

  <div class="settings-toggle" id="settingsToggle">
    <span>&#9881;</span> <span id="settingsLabel">SETTINGS</span>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-section">
      <div class="section-label">Durations</div>
      <div class="setting-row">
        <span class="setting-label">Work</span>
        <input type="range" id="workDur" min="1" max="60" step="1" value="25">
        <span class="setting-val" id="workDurVal">25m</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Short Break</span>
        <input type="range" id="shortDur" min="1" max="30" step="1" value="5">
        <span class="setting-val" id="shortDurVal">5m</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Long Break</span>
        <input type="range" id="longDur" min="5" max="60" step="1" value="15">
        <span class="setting-val" id="longDurVal">15m</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Rounds</span>
        <input type="range" id="roundsSet" min="1" max="8" step="1" value="4">
        <span class="setting-val" id="roundsSetVal">4</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-label">Color Theme</div>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="settings-section">
      <div class="section-label">Alert Sound</div>
      <div class="sound-grid" id="soundGrid">
        <button class="sound-btn active" data-sound="synth">Synth</button>
        <button class="sound-btn" data-sound="beep">Beep</button>
        <button class="sound-btn" data-sound="chime">Chime</button>
        <button class="sound-btn" data-sound="blip">Blip</button>
        <button class="sound-btn" data-sound="none">None</button>
      </div>
      <div class="toggle-row" style="margin-top:12px;">
        <div class="toggle on" id="audioToggle"></div>
        <span class="toggle-label">Audio enabled</span>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="stat">
      <div class="stat-val" id="statSessions">0</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statFocus">0m</div>
      <div class="stat-label">Focus time</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-label">Streak</div>
    </div>
  </div>
</div>

<script>
const COLORS = [
  { name:'Cyan',    hex:'#00ffc8', rgb:'0,255,200' },
  { name:'Magenta', hex:'#ff00cc', rgb:'255,0,204' },
  { name:'Amber',   hex:'#ffaa00', rgb:'255,170,0' },
  { name:'Blue',    hex:'#4488ff', rgb:'68,136,255' },
  { name:'Green',   hex:'#39ff14', rgb:'57,255,20' },
  { name:'Purple',  hex:'#cc44ff', rgb:'204,68,255' },
];

let accent = COLORS[0];
let audioOn = true;
let selectedSound = 'synth';
let durations = { work: 25, shortBreak: 5, longBreak: 15 };
let totalRounds = 4;
let currentMode = 'work';
let currentRound = 1;
let timeLeft = durations.work * 60;
let running = false;
let interval = null;
let sessions = 0;
let focusSecs = 0;
let streak = 0;

const CIRCUMFERENCE = 2 * Math.PI * 148;
const $ = id => document.getElementById(id);

function setAccent(c) {
  accent = c;
  document.documentElement.style.setProperty('--accent', c.hex);
  document.documentElement.style.setProperty('--accent-rgb', c.rgb);
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('active', s.dataset.color === c.name));
}

function buildColorGrid() {
  const g = $('colorGrid');
  COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c.name === accent.name ? ' active' : '');
    s.style.background = c.hex;
    s.dataset.color = c.name;
    s.title = c.name;
    s.onclick = () => setAccent(c);
    g.appendChild(s);
  });
}

function buildDots() {
  const d = $('roundDots');
  d.innerHTML = '';
  for (let i = 1; i <= totalRounds; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < currentRound ? ' done' : '');
    d.appendChild(dot);
  }
}

function updateRing() {
  const total = durations[currentMode] * 60;
  const offset = CIRCUMFERENCE * (1 - timeLeft / total);
  $('ringProg').style.strokeDashoffset = offset;
}

function formatTime(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function updateDisplay() {
  $('timerDisplay').textContent = formatTime(timeLeft);
  $('roundInfo').textContent = `ROUND ${currentRound} / ${totalRounds}`;
  updateRing();
  buildDots();
}

function switchMode(mode, round) {
  running = false; clearInterval(interval);
  currentMode = mode; currentRound = round;
  timeLeft = durations[mode] * 60;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  $('startBtn').textContent = 'START';
  updateDisplay();
}

function playSound(type) {
  if (!audioOn || type === 'none') return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.4, ctx.currentTime);
    master.connect(ctx.destination);
    const plays = {
      synth: () => {
        [440,554,659,880].forEach((f,i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sawtooth'; o.frequency.setValueAtTime(f, ctx.currentTime + i*0.12);
          g.gain.setValueAtTime(0.3, ctx.currentTime + i*0.12);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.12 + 0.25);
          o.connect(g); g.connect(master);
          o.start(ctx.currentTime + i*0.12); o.stop(ctx.currentTime + i*0.12 + 0.3);
        });
      },
      beep: () => {
        [880,880].forEach((f,i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'square'; o.frequency.value = f;
          g.gain.setValueAtTime(0.3, ctx.currentTime + i*0.2);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.2 + 0.15);
          o.connect(g); g.connect(master);
          o.start(ctx.currentTime + i*0.2); o.stop(ctx.currentTime + i*0.2 + 0.2);
        });
      },
      chime: () => {
        [523,659,784,1047].forEach((f,i) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.35, ctx.currentTime + i*0.15);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.5);
          o.connect(g); g.connect(master);
          o.start(ctx.currentTime + i*0.15); o.stop(ctx.currentTime + i*0.15 + 0.6);
        });
      },
      blip: () => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1200, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.2);
        g.gain.setValueAtTime(0.5, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        o.connect(g); g.connect(master);
        o.start(); o.stop(ctx.currentTime + 0.3);
      }
    };
    (plays[type] || plays.beep)();
  } catch(e) {}
}

function onComplete() {
  playSound(selectedSound);
  if (currentMode === 'work') {
    sessions++; focusSecs += durations.work * 60; streak++;
    $('statSessions').textContent = sessions;
    $('statFocus').textContent = Math.round(focusSecs/60) + 'm';
    $('statStreak').textContent = streak;
    switchMode(currentRound >= totalRounds ? 'longBreak' : 'shortBreak', currentRound);
  } else if (currentMode === 'longBreak') {
    switchMode('work', 1);
  } else {
    switchMode('work', currentRound + 1);
  }
}

function tick() {
  if (timeLeft <= 0) {
    clearInterval(interval); running = false;
    $('startBtn').textContent = 'START';
    onComplete(); return;
  }
  if (currentMode === 'work') focusSecs++;
  timeLeft--;
  updateDisplay();
  $('statFocus').textContent = Math.round(focusSecs/60) + 'm';
}

$('startBtn').onclick = () => {
  if (running) { clearInterval(interval); running = false; $('startBtn').textContent = 'START'; }
  else { running = true; $('startBtn').textContent = 'PAUSE'; interval = setInterval(tick, 1000); }
};

$('resetBtn').onclick = () => {
  clearInterval(interval); running = false;
  $('startBtn').textContent = 'START';
  timeLeft = durations[currentMode] * 60; updateDisplay();
};

$('skipBtn').onclick = () => { clearInterval(interval); running = false; $('startBtn').textContent = 'START'; onComplete(); };

document.querySelectorAll('.mode-tab').forEach(t => { t.onclick = () => switchMode(t.dataset.mode, currentRound); });

$('settingsToggle').onclick = () => {
  const p = $('settingsPanel');
  p.classList.toggle('open');
  $('settingsLabel').textContent = p.classList.contains('open') ? 'CLOSE' : 'SETTINGS';
};

function bindSlider(id, valId, key, unit, isRound) {
  const el = $(id), val = $(valId);
  el.oninput = () => {
    const v = parseInt(el.value);
    val.textContent = v + unit;
    if (isRound) { totalRounds = v; buildDots(); }
    else { durations[key] = v; if (currentMode === key) { timeLeft = v * 60; updateDisplay(); } }
  };
}

bindSlider('workDur','workDurVal','work','m',false);
bindSlider('shortDur','shortDurVal','shortBreak','m',false);
bindSlider('longDur','longDurVal','longBreak','m',false);
bindSlider('roundsSet','roundsSetVal',null,'',true);

document.querySelectorAll('.sound-btn').forEach(b => {
  b.onclick = () => {
    selectedSound = b.dataset.sound;
    document.querySelectorAll('.sound-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (b.dataset.sound !== 'none') playSound(b.dataset.sound);
  };
});

$('audioToggle').onclick = () => { audioOn = !audioOn; $('audioToggle').classList.toggle('on', audioOn); };

setAccent(COLORS[0]);
buildColorGrid();
updateDisplay();
</script>
</body>
</html>
